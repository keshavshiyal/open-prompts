<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>open-prompts | Modular Prompt Explorer</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-subtle: rgba(56, 189, 248, 0.12);
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 10px;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-subtle: rgba(2, 132, 199, 0.1);
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 0.75rem;
      background: var(--accent-subtle);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    /* Controls & Inputs */
    .btn {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .btn:hover { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }

    /* Main Layout */
    .container {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      height: calc(100vh - 69px);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .filters {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.6rem 2.5rem 0.6rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .kbd-hint {
      position: absolute;
      right: 0.6rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-family: var(--font-mono);
    }

    .category-pills {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: thin;
    }

    .pill {
      background: var(--bg-primary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .pill.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .prompt-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .prompt-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .prompt-card:hover { border-color: var(--accent); }
    .prompt-card.active {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .card-cat {
      font-size: 0.7rem;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-weight: 600;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }

    .tag {
      font-size: 0.72rem;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* Workspace / Detail Panel */
    .workspace {
      padding: 1.5rem 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .workspace-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.5rem;
      align-items: center;
    }

    .meta-badge {
      font-size: 0.78rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-family: var(--font-mono);
    }

    /* Variable Form */
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .var-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .var-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .var-field label {
      font-size: 0.82rem;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--accent);
    }

    .var-field span {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .var-field input, .var-field textarea, .var-field select {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: var(--font-sans);
      outline: none;
    }

    .var-field input:focus, .var-field textarea:focus {
      border-color: var(--accent);
    }

    /* Code / Output Blocks */
    .prompt-output {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      max-height: 420px;
      overflow-y: auto;
    }

    .var-highlight {
      background: var(--accent-subtle);
      color: var(--accent);
      padding: 0.05rem 0.3rem;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      place-items: center;
      z-index: 50;
      padding: 1rem;
    }

    .modal-backdrop.open { display: grid; }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--success);
      color: #052e16;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.9rem;
      transform: translateY(150%);
      transition: transform 0.25s ease;
      z-index: 100;
    }

    .toast.show { transform: translateY(0); }

    @media (max-width: 860px) {
      .container {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
      .sidebar {
        max-height: 380px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 1.5rem;">🌐</span>
      <h1>open-prompts</h1>
      <span class="badge" id="promptCountBadge">0 prompts</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="newPromptBtn">➕ New Prompt</button>
      <button class="btn" id="exportJsonBtn" title="Export current index.json">⬇️ Export JSON</button>
      <button class="btn" id="themeToggleBtn" title="Toggle Dark/Light Theme">🌓 Theme</button>
      <a href="https://github.com/keshavshiyal/open-prompts" target="_blank" rel="noopener" class="btn">⭐ GitHub</a>
    </div>
  </header>

  <div class="container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="filters">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search title, tags, or models..." />
          <span class="kbd-hint">/</span>
        </div>
        <div class="category-pills" id="categoryPills"></div>
      </div>
      <div class="prompt-list" id="promptList"></div>
    </aside>

    <!-- Right Workspace -->
    <main class="workspace" id="workspace">
      <!-- Populated dynamically via JS -->
    </main>
  </div>

  <!-- Create Custom Prompt Modal -->
  <div class="modal-backdrop" id="promptModal">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Create Modular Prompt</h3>
        <button class="btn" id="closeModalBtn">✕</button>
      </div>
      <div class="var-field">
        <label>Title</label>
        <input type="text" id="newTitle" placeholder="e.g., IndexedDB CRUD Wrapper Generator" />
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <div class="var-field">
          <label>Category</label>
          <select id="newCategory">
            <option value="coding">coding</option>
            <option value="linux">linux</option>
            <option value="education">education</option>
            <option value="data">data</option>
            <option value="design">design</option>
          </select>
        </div>
        <div class="var-field">
          <label>Recommended Models (comma-separated)</label>
          <input type="text" id="newModels" placeholder="Qwen-2.5-Coder-7B, Gemini-2.5" />
        </div>
      </div>
      <div class="var-field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="newTags" placeholder="javascript, pwa, offline-first" />
      </div>
      <div class="var-field">
        <label>System Role</label>
        <textarea id="newSystem" rows="2" placeholder="You are a senior systems engineer..."></textarea>
      </div>
      <div class="var-field">
        <label>Prompt Template (Use {{variable_name}} for dynamic inputs)</label>
        <textarea id="newPromptBody" rows="5" placeholder="Write a {{language}} script to automate {{task_description}}..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button class="btn" id="downloadMdBtn">📄 Download .md</button>
        <button class="btn btn-primary" id="saveCustomPromptBtn">💾 Save to Browser</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    // Built-in Starter Prompts (Works offline via file:// even before index.json is fetched)
    const FALLBACK_PROMPTS = [
      {
        id: "vanilla-pwa-scaffold",
        title: "Single-File Offline Utility Generator",
        category: "coding",
        tags: ["vanilla-js", "html5", "pwa", "indexeddb", "offline-first"],
        models: ["Qwen-2.5-Coder-7B", "Gemini-2.5-Pro"],
        temperature: 0.2,
        variables: [
          { name: "app_purpose", description: "Core utility goal", default: "Trainee Attendance & Record Tracker" },
          { name: "storage_engine", description: "Local persistence type", default: "IndexedDB" },
          { name: "ui_theme", description: "Visual aesthetic", default: "Clean Dark Slate UI" }
        ],
        system: "You are an expert front-end architect specializing in zero-dependency, offline-first single-file web applications. Never use external JS/CSS CDNs.",
        prompt: "Build a complete, self-contained single-file HTML application (`index.html`) for a **{{app_purpose}}**.\n\n### Technical Constraints:\n1. **Zero Dependencies:** Pure Vanilla HTML5, CSS3, and ES6+ JavaScript inside a single file.\n2. **Storage Engine:** Implement full CRUD operations using **{{storage_engine}}**.\n3. **UI/UX:** Responsive layout styled with a **{{ui_theme}}**, keyboard shortcuts, search filtering, and JSON backup import/export."
      },
      {
        id: "bash-automation-architect",
        title: "Defensive Bash & Termux Script Builder",
        category: "linux",
        tags: ["bash", "shell", "linux", "termux", "automation"],
        models: ["Qwen-2.5-Coder-7B", "Llama-3.1-8B"],
        temperature: 0.1,
        variables: [
          { name: "task_goal", description: "What the script should automate", default: "Incremental directory backup with tar.gz rotation" },
          { name: "environment", description: "Target OS environment", default: "Ubuntu / Termux Android" }
        ],
        system: "You are a senior Linux administrator. Write POSIX-compliant, defensive shell scripts with strict error handling.",
        prompt: "Write a production-ready Bash script for **{{environment}}** that performs the following task:\n**{{task_goal}}**\n\n### Requirements:\n- Start with `set -euo pipefail`.\n- Include `--help` and `--dry-run` flags.\n- Add timestamped logging and graceful error traps (`trap cleanup EXIT`)."
      },
      {
        id: "bilingual-tech-explainer",
        title: "Vocational Lab & Bilingual Concept Guide",
        category: "education",
        tags: ["curriculum", "iti", "copa", "bilingual", "lab-manual"],
        models: ["Gemini-2.5-Flash", "Qwen-2.5-7B"],
        temperature: 0.4,
        variables: [
          { name: "topic", description: "Technical concept to teach", default: "SQL INNER JOIN vs LEFT JOIN" },
          { name: "secondary_language", description: "Regional language for summary", default: "Gujarati" },
          { name: "student_level", description: "Target audience level", default: "ITI COPA / BCA Undergraduate" }
        ],
        system: "You are a practical technical instructor who explains computer science concepts using real-world analogies and hands-on lab tasks.",
        prompt: "Create a structured study and practical lab guide on **{{topic}}** tailored for **{{student_level}}** trainees.\n\n### Structure:\n1. **Core Concept:** Crisp explanation in English with a real-world analogy.\n2. **Bilingual Key Takeaways:** Explain the core logic clearly in **{{secondary_language}}**.\n3. **Step-by-Step Practical Exercise:** A 15-minute lab task students can run on their PC.\n4. **Viva Questions:** 5 practical viva-voce questions with concise answers."
      },
      {
        id: "strict-json-extractor",
        title: "Unstructured Text to Strict JSON Schema",
        category: "data",
        tags: ["json", "schema", "etl", "data-cleaning"],
        models: ["Qwen-2.5-7B", "Gemini-2.5-Flash"],
        temperature: 0.0,
        variables: [
          { name: "target_fields", description: "Comma-separated keys to extract", default: "invoice_no, date, vendor_name, total_amount_inr, gstin" },
          { name: "raw_input", description: "Unstructured text to parse", default: "Bill #INV-2026-89 from Shiv Sagar Fastfood on 11-Nov-2026. Total paid Rs. 450.00." }
        ],
        system: "You are a deterministic data extraction engine. Output ONLY valid, minified JSON without Markdown code fences or commentary.",
        prompt: "Extract the following fields from the text below: `[{{target_fields}}]`.\nIf a field is missing, set its value to `null`.\n\n### Input Text:\n{{raw_input}}"
      }
    ];

    const state = {
      prompts: [],
      selectedId: null,
      activeCategory: "all",
      searchQuery: "",
      variableValues: {}
    };

    // Initialize Application
    async function init() {
      const savedTheme = localStorage.getItem("open_prompts_theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      let loadedPrompts = [...FALLBACK_PROMPTS];
      try {
        const res = await fetch("./index.json", { cache: "no-store" });
        if (res.ok) {
          const externalData = await res.json();
          if (Array.isArray(externalData) && externalData.length > 0) {
            loadedPrompts = externalData;
          }
        }
      } catch (e) {
        // Silently use FALLBACK_PROMPTS when running locally via file://
      }

      const customPrompts = JSON.parse(localStorage.getItem("open_prompts_custom") || "[]");
      state.prompts = [...customPrompts, ...loadedPrompts];
      state.selectedId = state.prompts[0]?.id || null;

      bindEvents();
      renderApp();
    }

    function getFilteredPrompts() {
      return state.prompts.filter(p => {
        const matchesCat = state.activeCategory === "all" || p.category === state.activeCategory;
        const q = state.searchQuery.toLowerCase().trim();
        if (!q) return matchesCat;
        const hay = `${p.title} ${p.category} ${(p.tags || []).join(" ")} ${(p.models || []).join(" ")}`.toLowerCase();
        return matchesCat && hay.includes(q);
      });
    }

    function renderCategories() {
      const cats = ["all", ...new Set(state.prompts.map(p => p.category))];
      const container = document.getElementById("categoryPills");
      container.innerHTML = cats.map(cat => `
        <button class="pill ${state.activeCategory === cat ? 'active' : ''}" data-cat="${cat}">
          ${cat.toUpperCase()}
        </button>
      `).join("");
    }

    function renderPromptList() {
      const filtered = getFilteredPrompts();
      document.getElementById("promptCountBadge").textContent = `${state.prompts.length} prompts`;
      const listEl = document.getElementById("promptList");

      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="padding:1.5rem; text-align:center; color:var(--text-secondary);">No matching prompts found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(p => `
        <div class="prompt-card ${p.id === state.selectedId ? 'active' : ''}" data-id="${p.id}">
          <div class="card-header">
            <div class="card-title">${escapeHtml(p.title)}</div>
            <span class="card-cat">${escapeHtml(p.category)}</span>
          </div>
          <div class="card-tags">
            ${(p.tags || []).slice(0, 4).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join("")}
          </div>
        </div>
      `).join("");
    }

    function compileText(template, promptObj, highlightHtml = false) {
      if (!template) return "";
      let out = highlightHtml ? escapeHtml(template) : template;
      const vars = promptObj.variables || [];
      vars.forEach(v => {
        const key = `${promptObj.id}_${v.name}`;
        const val = state.variableValues[key] !== undefined ? state.variableValues[key] : (v.default || `{{${v.name}}}`);
        const regex = new RegExp(`\\{\\{\\s*${v.name}\\s*\\}\\}`, "g");
        if (highlightHtml) {
          out = out.replace(regex, `<span class="var-highlight">${escapeHtml(val)}</span>`);
        } else {
          out = out.replace(regex, val);
        }
      });
      return out;
    }

    function renderWorkspace() {
      const ws = document.getElementById("workspace");
      const prompt = state.prompts.find(p => p.id === state.selectedId);

      if (!prompt) {
        ws.innerHTML = `<div class="panel">Select a prompt from the left sidebar to inspect and customize.</div>`;
        return;
      }

      const vars = prompt.variables || [];
      const compiledSystem = compileText(prompt.system, prompt, true);
      const compiledPrompt = compileText(prompt.prompt, prompt, true);
      const rawFullText = (prompt.system ? `System:\n${compileText(prompt.system, prompt, false)}\n\n` : "") + compileText(prompt.prompt, prompt, false);
      const defaultModel = (prompt.models && prompt.models[0]) ? prompt.models[0].toLowerCase().replace(/[^a-z0-9.-]/g, '') : "qwen2.5-coder:7b";

      ws.innerHTML = `
        <div class="workspace-header">
          <div>
            <h2 style="font-size:1.5rem;">${escapeHtml(prompt.title)}</h2>
            <div class="meta-row">
              <span class="meta-badge">📂 ${escapeHtml(prompt.category)}</span>
              <span class="meta-badge">🌡️ temp: ${prompt.temperature ?? 0.2}</span>
              ${(prompt.models || []).map(m => `<span class="meta-badge">🤖 ${escapeHtml(m)}</span>`).join("")}
            </div>
          </div>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn" id="copySystemBtn">Copy System</button>
            <button class="btn btn-primary" id="copyFullPromptBtn">📋 Copy Compiled Prompt</button>
          </div>
        </div>

        ${vars.length > 0 ? `
        <div class="panel">
          <div class="panel-title">
            <span>🎛️ Dynamic Variables (${vars.length})</span>
            <button class="btn" id="resetVarsBtn" style="padding:0.2rem 0.6rem; font-size:0.75rem;">Reset Defaults</button>
          </div>
          <div class="var-grid">
            ${vars.map(v => {
              const key = `${prompt.id}_${v.name}`;
              const currentVal = state.variableValues[key] !== undefined ? state.variableValues[key] : (v.default || "");
              return `
                <div class="var-field">
                  <label>{{${escapeHtml(v.name)}}}</label>
                  <span>${escapeHtml(v.description || "")}</span>
                  <input type="text" class="var-input" data-var="${escapeHtml(v.name)}" value="${escapeHtml(currentVal)}" />
                </div>
              `;
            }).join("")}
          </div>
        </div>` : ""}

        <div class="panel">
          <div class="panel-title">
            <span>⚡ Live Compiled Preview</span>
            <span style="font-family:var(--font-mono); font-size:0.75rem;">~${Math.ceil(rawFullText.length / 4)} tokens</span>
          </div>
          ${prompt.system ? `
            <div style="margin-bottom:0.75rem;">
              <div style="font-size:0.75rem; color:var(--text-secondary); margin-bottom:0.25rem; font-weight:600;">SYSTEM PROMPT</div>
              <div class="prompt-output" id="previewSystem">${compiledSystem}</div>
            </div>
          ` : ""}
          <div>
            <div style="font-size:0.75rem; color:var(--text-secondary); margin-bottom:0.25rem; font-weight:600;">USER PROMPT</div>
            <div class="prompt-output" id="previewPrompt">${compiledPrompt}</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">
            <span>🐧 Ollama / CLI One-Liner</span>
            <button class="btn" id="copyCliBtn" style="padding:0.25rem 0.65rem; font-size:0.75rem;">Copy CLI Command</button>
          </div>
          <div class="prompt-output" id="cliPreview" style="font-size:0.8rem;">ollama run ${escapeHtml(defaultModel)} "${escapeHtml(rawFullText.replace(/"/g, '\\"'))}"</div>
        </div>
      `;

      // Bind live variable typing without losing input focus
      ws.querySelectorAll(".var-input").forEach(input => {
        input.addEventListener("input", (e) => {
          const varName = e.target.getAttribute("data-var");
          state.variableValues[`${prompt.id}_${varName}`] = e.target.value;
          updateLivePreviews(prompt);
        });
      });

      ws.querySelector("#resetVarsBtn")?.addEventListener("click", () => {
        vars.forEach(v => delete state.variableValues[`${prompt.id}_${v.name}`]);
        renderWorkspace();
      });

      ws.querySelector("#copyFullPromptBtn")?.addEventListener("click", () => {
        const text = (prompt.system ? `${compileText(prompt.system, prompt, false)}\n\n` : "") + compileText(prompt.prompt, prompt, false);
        copyToClipboard(text, "Compiled prompt copied!");
      });

      ws.querySelector("#copySystemBtn")?.addEventListener("click", () => {
        copyToClipboard(compileText(prompt.system || "", prompt, false), "System prompt copied!");
      });

      ws.querySelector("#copyCliBtn")?.addEventListener("click", () => {
        const text = document.getElementById("cliPreview").textContent;
        copyToClipboard(text, "Ollama CLI command copied!");
      });
    }

    function updateLivePreviews(prompt) {
      const sysEl = document.getElementById("previewSystem");
      const usrEl = document.getElementById("previewPrompt");
      const cliEl = document.getElementById("cliPreview");
      if (sysEl) sysEl.innerHTML = compileText(prompt.system, prompt, true);
      if (usrEl) usrEl.innerHTML = compileText(prompt.prompt, prompt, true);
      if (cliEl) {
        const rawFull = (prompt.system ? `System:\n${compileText(prompt.system, prompt, false)}\n\n` : "") + compileText(prompt.prompt, prompt, false);
        const defaultModel = (prompt.models && prompt.models[0]) ? prompt.models[0].toLowerCase().replace(/[^a-z0-9.-]/g, '') : "qwen2.5-coder:7b";
        cliEl.textContent = `ollama run ${defaultModel} "${rawFull.replace(/"/g, '\\"')}"`;
      }
    }

    function renderApp() {
      renderCategories();
      renderPromptList();
      renderWorkspace();
    }

    function bindEvents() {
      // Search input & "/" shortcut
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        renderPromptList();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      // Category selection
      document.getElementById("categoryPills").addEventListener("click", (e) => {
        const btn = e.target.closest(".pill");
        if (!btn) return;
        state.activeCategory = btn.getAttribute("data-cat");
        renderCategories();
        renderPromptList();
      });

      // Prompt selection
      document.getElementById("promptList").addEventListener("click", (e) => {
        const card = e.target.closest(".prompt-card");
        if (!card) return;
        state.selectedId = card.getAttribute("data-id");
        renderPromptList();
        renderWorkspace();
      });

      // Theme toggle
      document.getElementById("themeToggleBtn").addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("open_prompts_theme", next);
      });

      // Export JSON
      document.getElementById("exportJsonBtn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state.prompts, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "index.json";
        a.click();
        URL.revokeObjectURL(url);
      });

      // Modal Events
      const modal = document.getElementById("promptModal");
      document.getElementById("newPromptBtn").addEventListener("click", () => modal.classList.add("open"));
      document.getElementById("closeModalBtn").addEventListener("click", () => modal.classList.remove("open"));

      document.getElementById("saveCustomPromptBtn").addEventListener("click", () => {
        const p = buildPromptFromModal();
        if (!p) return;
        const custom = JSON.parse(localStorage.getItem("open_prompts_custom") || "[]");
        custom.unshift(p);
        localStorage.setItem("open_prompts_custom", JSON.stringify(custom));
        state.prompts.unshift(p);
        state.selectedId = p.id;
        modal.classList.remove("open");
        renderApp();
        showToast("Saved to browser storage!");
      });

      document.getElementById("downloadMdBtn").addEventListener("click", () => {
        const p = buildPromptFromModal();
        if (!p) return;
        const md = generateMarkdownFile(p);
        const blob = new Blob([md], { type: "text/markdown" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${p.id}.md`;
        a.click();
      });
    }

    function buildPromptFromModal() {
      const title = document.getElementById("newTitle").value.trim();
      const body = document.getElementById("newPromptBody").value.trim();
      if (!title || !body) {
        alert("Please provide at least a Title and Prompt Template.");
        return null;
      }
      const id = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      const varMatches = [...body.matchAll(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g)].map(m => m[1]);
      const uniqueVars = [...new Set(varMatches)].map(name => ({
        name,
        description: `Value for ${name}`,
        default: ""
      }));

      return {
        id,
        title,
        category: document.getElementById("newCategory").value,
        tags: document.getElementById("newTags").value.split(",").map(s => s.trim()).filter(Boolean),
        models: document.getElementById("newModels").value.split(",").map(s => s.trim()).filter(Boolean),
        temperature: 0.2,
        variables: uniqueVars,
        system: document.getElementById("newSystem").value.trim(),
        prompt: body
      };
    }

    function generateMarkdownFile(p) {
      return `---
id: "${p.id}"
title: "${p.title}"
category: "${p.category}"
tags: ${JSON.stringify(p.tags)}
models: ${JSON.stringify(p.models)}
temperature: ${p.temperature}
variables:
${p.variables.map(v => `  - name: "${v.name}"\n    description: "${v.description}"\n    default: ""`).join("\n")}
---

## System
${p.system}

## Prompt
${p.prompt}
`;
    }

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => showToast(msg));
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    init();
  </script>
</body>
</html>
